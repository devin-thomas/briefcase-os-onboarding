<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111419" />
    <meta name="description" content="BriefcaseOS candidate onboarding demo" />
    <title>BriefcaseOS · Candidate onboarding</title>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('briefcaseos.demo.preferences.v1');
          const saved = raw ? JSON.parse(raw) : null;
          const theme = saved?.theme === 'light' ? 'light' : 'dark';
          const accent = /^#[0-9a-f]{6}$/i.test(saved?.accent || '') ? saved.accent : '#2f80ed';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.setProperty('--accent', accent);
          document.documentElement.style.colorScheme = theme;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
