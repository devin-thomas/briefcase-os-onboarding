name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Public-string guard
        run: |
          ! grep -RniE 'briefcase-onboarding-internal|uppercut|workers\.dev|account_id|zone_id|candidate-devin|San Antonio, TX|AIza[0-9A-Za-z_-]{20,}' src server public tests dist package.json .env.example index.html vite.config.ts tsconfig.json
