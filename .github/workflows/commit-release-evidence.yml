name: Commit release evidence

on:
  push:
    branches: [agent/clean-room-foundation]

permissions:
  actions: read
  contents: write

jobs:
  evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-room-foundation
      - name: Download successful release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 30573308739 -n release-evidence -D /tmp/evidence
      - name: Prepare portfolio assets
        run: |
          python -m pip install --quiet pillow
          mkdir -p docs/images
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('/tmp/evidence/artifacts/portfolio')
          target = Path('docs/images')
          for original, output in [
              ('chromium-desktop-01-entry.png', 'onboarding-entry.png'),
              ('chromium-desktop-02-sample.png', 'sample-profile-review.png'),
          ]:
              Image.open(source / original).convert('RGB').save(target / output, optimize=True)
          Image.open(source / 'chromium-desktop-03-completion.png').convert('RGB').crop((0, 0, 1440, 1150)).save(target / 'completion-workbench.png', optimize=True)
          Image.open(source / 'chromium-mobile-01-entry.png').convert('RGB').crop((0, 0, 1082, 2300)).save(target / 'mobile-onboarding.png', optimize=True)
          PY
          cp /tmp/evidence/artifacts/release/dependency-licenses.md docs/dependency-licenses.md
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images docs/dependency-licenses.md
          git diff --cached --quiet || git commit -m "Add verified portfolio and license evidence"
          git diff --cached --quiet && git push
